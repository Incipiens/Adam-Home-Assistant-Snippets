substitutions:
  device_name: "reterminal-photo-frame"
  friendly_name: "Photo Frame"
  sleep_duration: "360min"
  # Home Assistant base URL (no trailing slash)
  ha_url: "http://192.168.2.3:8123"
  # Path to the processed image on HA
  image_path: "/local/photo_frame/current.png"

esphome:
  name: reterminal-e1002
  friendly_name: reTerminal E1002
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.arduino.memory_type: qio_opi
  on_boot:
    priority: 600
    then:
      - output.turn_on: bsp_sd_enable
      - output.turn_on: bsp_battery_enable
      - delay: 200ms
      - component.update: battery_voltage
      - component.update: battery_level
      

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
  


http_request:
  verify_ssl: false
  timeout: 20s
  watchdog_timeout: 25s



online_image:
  - url: "${ha_url}${image_path}"
    id: frame_image
    format: png
    buffer_size: 65536
    type: RGB565
    resize: 800x480
    on_download_finished:
      then:
        - logger.log: "Image downloaded, updating display..."
        - component.update: epaper_display
        - delay: 45s
        - logger.log: "Display refresh complete, entering deep sleep..."
        - deep_sleep.enter: deep_sleep_1
    on_error:
      then:
        - logger.log: "Image download FAILED"
        - delay: 30s
        - deep_sleep.enter: deep_sleep_1

psram:
  mode: octal
  speed: 80MHz

i2s_audio:
  - id: i2s0
    i2s_bclk_pin: GPIO42
    i2s_lrclk_pin: GPIO2 

deep_sleep:
  id: deep_sleep_1
  sleep_duration: 60min    
  wakeup_pin: 
    number: GPIO4
    allow_other_uses: true
    mode:
      input: True
      pulldown: True
  wakeup_pin_mode: INVERT_WAKEUP


spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9
i2c:
  scl: GPIO20
  sda: GPIO19


globals:
  - id: should_debug
    type: bool
    restore_value: no
    initial_value: "true"

  - id: current_index
    type: int
    initial_value: '1'


sensor:
  - platform: sht4x
    temperature:
      name: "Temperature"
      id: temp_sensor
    humidity:
      name: "Relative Humidity"
      id: hum_sensor
  - platform: adc
    pin: GPIO1
    name: "Battery Voltage"
    id: battery_voltage
    update_interval: 60s
    attenuation: 12db
    filters:
      - multiply: 2.0
  - platform: template
    name: "Battery Level"
    id: battery_level
    unit_of_measurement: "%"
    icon: "mdi:battery"
    device_class: battery
    state_class: measurement
    lambda: 'return id(battery_voltage).state;'
    update_interval: 60s
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100

output:
  - platform: gpio
    pin: GPIO6
    id: bsp_led
    inverted: true
  - platform: gpio
    pin: GPIO16
    id: bsp_sd_enable
  - platform: gpio
    pin: GPIO21
    id: bsp_battery_enable

light:
  - platform: binary
    name: "Onboard LED"
    output: bsp_led
    id: onboard_led
    
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    id: key1
    name: "Key1"


  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    id: key2
    name: "Key2"


  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    id: key3
    name: "Key3"

time:
  - platform: homeassistant
    id: ha_time


script:
  - id: fetch_and_display
    then:
      - logger.log: "Fetching image from Home Assistant..."
      - online_image.set_url:
          id: frame_image
          url: "${ha_url}${image_path}"
      - component.update: frame_image


display:
  - platform: epaper_spi
    id: epaper_display
    model: Seeed-reTerminal-E1002
    update_interval: never
    lambda: |-
      it.image(0, 0, id(frame_image));
      

# Enable logging
logger:
  

# Enable Home Assistant API
api:
  encryption:
    key: "x="

ota:
  - platform: esphome
    password: "x"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect: 
    then:
      - logger.log: "Updating image"
      - script.execute: fetch_and_display

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Reterminal-E1002"
    password: "x"

captive_portal:
    